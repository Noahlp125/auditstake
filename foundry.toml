[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# El script de despliegue escribe aqui las direcciones para el frontend
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 50

# Redes con nombre: `--rpc-url sepolia` lee la URL de la variable SEPOLIA_RPC_URL (.env)
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

# Verificacion de codigo en Etherscan (`--verify`)
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
